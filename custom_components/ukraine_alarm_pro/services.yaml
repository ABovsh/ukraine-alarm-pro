get_history:
  fields:
    region_id:
      required: true
      example: "31"
      selector:
        text:
    limit:
      default: 20
      selector:
        number:
          min: 1
          max: 100
          mode: box
get_summary:
  fields:
    region_id:
      required: true
      example: "31"
      selector:
        text:
    days:
      default: 1
      selector:
        select:
          options:
            - "1"
            - "7"
