# Ukraine Alarm Pro — компактна картка стану тривоги.
# Один рядок на регіон: тривога з типами, рівнем, часом і тривалістю, або «тихо».
# Застарілі дані показуються як «немає свіжих даних», а не як тиша.
# У `regions` перелічіть ID своїх регіонів (як у binary_sensor.uap_<id>_alert).
# У `short` за бажанням задайте короткі назви.
type: markdown
content: |
  {%- set regions = ['31'] -%}
  {%- set short = {} -%}
  {%- set types = {'air': 'повітряна', 'artillery': 'артобстріл', 'urban_fights': 'вуличні бої',
    'chemical': 'хімічна', 'nuclear': 'радіаційна', 'unrecognized': 'невідомий тип'} -%}
  {%- set levels = {'yellow': ' 🟡', 'red': ' 🔴'} -%}
  {%- set stale = is_state('binary_sensor.uap_data_stale', 'on') -%}
  {%- for rid in regions -%}
  {%- set t = 'sensor.uap_' ~ rid ~ '_threat' -%}
  {%- set name = short.get(rid) or state_attr(t, 'region_name') or rid -%}
  {%- set a = states('binary_sensor.uap_' ~ rid ~ '_alert') -%}
  {%- if a == 'on' -%}
  {%- set ns = namespace(o=[]) -%}
  {%- for x in (state_attr(t, 'active_threat_types') or '').split(',') if x -%}
  {%- set ns.o = ns.o + [types.get(x, x)] -%}
  {%- endfor -%}
  {%- set lvl = states('sensor.uap_' ~ rid ~ '_air_alert_level') -%}
  {%- set st = states('sensor.uap_' ~ rid ~ '_alert_started') | as_datetime -%}
  🚨 **{{ name }}** · {{ ns.o | join(', ') }}{{ levels[lvl] if lvl in levels else '' }}
  {%- if st -%}
  {%- set m = ((now() - st).total_seconds() // 60) | int %} · з {{ (st | as_local).strftime('%H:%M') }}, {{ ((m // 60) ~ ' год ' if m >= 60 else '') ~ (m % 60) ~ ' хв' }}
  {%- endif -%}
  {{ ' · частина регіону' if state_attr(t, 'coverage') == 'partial' else '' }}
  {%- elif a == 'off' -%}
  {{ '⚪' if stale else '🟢' }} **{{ name }}** · {{ 'немає свіжих даних' if stale else 'тихо' }}
  {%- else -%}
  ⚪ **{{ name }}** · даних ще немає
  {%- endif %}

  {% endfor -%}
  {%- set upd = states('sensor.uap_last_update') | as_datetime -%}
  <sub>{{ '⚠️ Дані застаріли' if stale else '✓ Дані актуальні' }}{{ ' · оновлено о ' ~ (upd | as_local).strftime('%H:%M') if upd else '' }}</sub>
