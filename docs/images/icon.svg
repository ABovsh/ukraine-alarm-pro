<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5fd1"/><stop offset="1" stop-color="#062a66"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/><stop offset="1" stop-color="#f5b800"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3f8f"/><stop offset="1" stop-color="#071f4d"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff8a80"/><stop offset="0.45" stop-color="#ff3b30"/><stop offset="1" stop-color="#b3130b"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5a4f" stop-opacity="0.55"/><stop offset="1" stop-color="#ff5a4f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bg)"/>
  <!-- shield -->
  <path filter="url(#shadow)" fill="url(#shield)"
    d="M256 62 L414 116 C414 116 420 300 256 452 C92 300 98 116 98 116 Z"/>
  <path fill="url(#inner)"
