    <path d="M186 206 A86 86 0 0 0 186 292"/>
    <path d="M326 206 A86 86 0 0 1 326 292"/>
  </g>
  <g fill="none" stroke="#ffd500" stroke-linecap="round" stroke-width="10" opacity="0.9">
    <path d="M226 150 L218 128"/><path d="M256 142 L256 118"/><path d="M286 150 L294 128"/>
  </g>
  <!-- siren -->
  <path fill="url(#dome)" d="M206 300 L206 244 A50 50 0 0 1 306 244 L306 300 Z"/>
  <path fill="#fff" opacity="0.55" d="M224 262 L224 246 A32 32 0 0 1 250 214 A40 40 0 0 0 236 262 Z"/>
  <rect x="190" y="298" width="132" height="26" rx="8" fill="#ffd500"/>
  <rect x="190" y="298" width="132" height="10" rx="5" fill="#fff" opacity="0.35"/>
