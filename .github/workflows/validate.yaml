name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (py${{ matrix.python-version }}, HA ${{ matrix.ha-label }})
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test the declared floor. pycares 4.5 predates its process-wide
          # shutdown thread, which this historical test-helper cannot exempt.
          - python-version: "3.13"
            ha-pin: "homeassistant==2025.1.0 pytest-homeassistant-custom-component==0.13.201 pycares==4.5.0"
            ha-label: "min"
          # Ceiling: latest HA + deps on a current Python.
          - python-version: "3.14"
            ha-pin: ""
            ha-label: "latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0" # v7.1.0
        with:
          python-version: "${{ matrix.python-version }}"
          cache: "pip"
          cache-dependency-path: "requirements_test.txt"

      - name: Install test dependencies
        env:
          HA_PIN: "${{ matrix.ha-pin }}"
        run: |
          if [ -n "$HA_PIN" ]; then
            # shellcheck disable=SC2086 — intentional word-split of pin list
            python -m pip install -r requirements_test.txt $HA_PIN
          else
            python -m pip install -r requirements_test.txt
          fi
          python -c "from homeassistant.const import __version__; print('HA', __version__)"

      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/ukraine_alarm_pro/manifest.json >/dev/null
          python -m json.tool custom_components/ukraine_alarm_pro/strings.json >/dev/null
          python -m json.tool custom_components/ukraine_alarm_pro/translations/en.json >/dev/null
          python -m json.tool hacs.json >/dev/null

      - name: Compile integration
        run: "python -m compileall custom_components/ukraine_alarm_pro"

      - name: Lint
        run: "python -m ruff check custom_components/ukraine_alarm_pro tests"

      - name: Install browser
        run: "python -m playwright install --with-deps chromium"

      - name: Run tests
        env:
          UAP_CARD_LCOV_PATH: coverage-card.lcov
        run: "python -m pytest tests -q --cov=custom_components/ukraine_alarm_pro --cov-report=xml"

      - name: Upload coverage report
        # One leg only so two matrix legs can't race to upload the same artifact.
        if: github.event_name != 'pull_request' && matrix.ha-label == 'min'
        uses: "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
        with:
          name: coverage-xml
          path: |
            coverage.xml
            coverage-card.lcov
          retention-days: 1

  sonar:
    name: SonarCloud
    needs: test
    # Gated until the SonarCloud project + SONAR_TOKEN secret exist:
    # flip repo variable SONAR_ENABLED to "true" to activate.
    # Dependabot branches read the dependabot secret store, where SONAR_TOKEN
    # doesn't exist — the scanner would fail with "Not authorized" on every
    # bump PR. Skip instead of failing.
    if: >-
      github.event_name != 'pull_request' && vars.SONAR_ENABLED == 'true'
      && github.actor != 'dependabot[bot]'
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
        with:
          name: coverage-xml

      - name: SonarCloud scan
        uses: "SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9" # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarcloud.io"

  validate-hacs:
    name: HACS
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: HACS validation
        uses: "hacs/action@d556e736723344f83838d08488c983a15381059a" # 22.5.0
        with:
          category: "integration"

  validate-hassfest:
    name: Hassfest
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-07
